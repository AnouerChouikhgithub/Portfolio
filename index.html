<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Anouer Chouikh — Engineering & Innovation Portfolio" />
    <title>Anouer — Engineering & Innovation Portfolio</title>
    <link rel="canonical" href="https://chouikh-anouer.netlify.app/" />
    <link rel="alternate" hreflang="en" href="https://chouikh-anouer.netlify.app/" />
    <link rel="alternate" hreflang="fr" href="https://chouikh-anouer.netlify.app/?lang=fr" />
    <link rel="alternate" hreflang="ar" href="https://chouikh-anouer.netlify.app/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="https://chouikh-anouer.netlify.app/" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the Arabic face up front when the visitor is Arabic-first,
         so the Cairo swap does not cause a layout shift after hydration. -->
    <script>
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const stored = localStorage.getItem('portfolio-language');
          const browser = (navigator.language || 'en').slice(0, 2);
          const lang = params.get('lang') || stored || browser;
          if (lang === 'ar') {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'style';
            link.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap';
            link.onload = () => { link.rel = 'stylesheet'; };
            document.head.appendChild(link);
          }
        } catch {
          /* storage / navigator access denied — nothing to preload */
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="icon" href="/AnouerChouikhLogo.ico" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anouer Chouikh — Engineering & Innovation Portfolio" />
    <title>Anouer — Engineering & Innovation Portfolio</title>
    <link rel="icon" href="public/AnouerChouikhLogo.ico" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify: static form markup so Netlify can detect the form at build time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

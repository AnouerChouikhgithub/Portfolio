
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anouer Chouikh — Engineering & Innovation Portfolio" />
    <title>Anouer — Engineering & Innovation Portfolio</title>
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="fr" href="/?lang=fr" />
    <link rel="alternate" hreflang="ar" href="/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="/" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <link rel="icon" href="public/AnouerChouikhLogo.ico" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify: static form markup so Netlify can detect the form at build time -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="from_name" />
      <input type="email" name="from_email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
